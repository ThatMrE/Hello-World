  <text x="300" y="206" text-anchor="middle" font-family="Haettenschweiler,'Arial Narrow Bold',Impact,sans-serif" font-size="92" fill="#0e0e0e" letter-spacing="2" textLength="430" lengthAdjust="spacingAndGlyphs">LOCARNO</text>
