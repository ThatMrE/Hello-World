<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Porkpie Paranoia cover: a porkpie hat over a checkerboard eye">
  <defs>
    <pattern id="p-chk" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#f4f1e8"/>
      <rect width="24" height="24" fill="#0e0e0e"/>
      <rect x="24" y="24" width="24" height="24" fill="#0e0e0e"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="#ffc629"/>
  <rect y="384" width="600" height="96" fill="url(#p-chk)"/>

  <!-- staring eye -->
  <ellipse cx="300" cy="278" rx="150" ry="96" fill="#f4f1e8" stroke="#0e0e0e" stroke-width="10"/>
  <circle cx="300" cy="278" r="62" fill="#c8352b" stroke="#0e0e0e" stroke-width="10"/>
  <circle cx="300" cy="278" r="24" fill="#0e0e0e"/>
  <circle cx="322" cy="258" r="10" fill="#f4f1e8"/>

  <!-- hat -->
  <g fill="#0e0e0e">
    <rect x="222" y="112" width="156" height="62" rx="8"/>
    <ellipse cx="300" cy="176" rx="176" ry="24"/>
  </g>
  <rect x="222" y="112" width="156" height="18" fill="#c8352b"/>

  <text x="300" y="530" text-anchor="middle" font-family="Haettenschweiler,'Arial Narrow Bold',Impact,sans-serif" font-size="76" fill="#0e0e0e" letter-spacing="2" textLength="340" lengthAdjust="spacingAndGlyphs">PORKPIE</text>
  <text x="300" y="578" text-anchor="middle" font-family="Haettenschweiler,'Arial Narrow Bold',Impact,sans-serif" font-size="52" fill="#c8352b" letter-spacing="6" textLength="360" lengthAdjust="spacingAndGlyphs">PARANOIA</text>
  <text x="24" y="46" font-family="ui-monospace,monospace" font-size="20" fill="#0e0e0e" letter-spacing="6">HALF BAD</text>
  <text x="576" y="46" text-anchor="end" font-family="ui-monospace,monospace" font-size="20" fill="#0e0e0e" letter-spacing="4">LP04</text>
</svg>
