<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="The Rudeness EP cover: organ keys and a checker border">
  <defs>
    <pattern id="r-chk" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f4f1e8"/>
      <rect width="20" height="20" fill="#0e0e0e"/>
      <rect x="20" y="20" width="20" height="20" fill="#0e0e0e"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="#1e7a5e"/>
  <rect width="600" height="40" fill="url(#r-chk)"/>
  <rect y="560" width="600" height="40" fill="url(#r-chk)"/>

  <!-- organ keyboard, on the skew -->
  <g transform="translate(300 330) rotate(-8) translate(-300 -330)">
    <rect x="86" y="252" width="428" height="156" fill="#f4f1e8" stroke="#0e0e0e" stroke-width="10"/>
    <g stroke="#0e0e0e" stroke-width="6">
      <path d="M147 252v156M208 252v156M269 252v156M330 252v156M391 252v156M452 252v156"/>
    </g>
    <g fill="#0e0e0e">
      <rect x="128" y="252" width="34" height="94"/><rect x="192" y="252" width="34" height="94"/>
      <rect x="314" y="252" width="34" height="94"/><rect x="376" y="252" width="34" height="94"/>
      <rect x="438" y="252" width="34" height="94"/>
    </g>
    <rect x="86" y="222" width="428" height="30" fill="#c8352b" stroke="#0e0e0e" stroke-width="10"/>
  </g>

  <text x="300" y="150" text-anchor="middle" font-family="Haettenschweiler,'Arial Narrow Bold',Impact,sans-serif" font-size="112" fill="#f4f1e8" letter-spacing="4" textLength="470" lengthAdjust="spacingAndGlyphs">RUDENESS</text>
  <text x="300" y="196" text-anchor="middle" font-family="ui-monospace,monospace" font-size="22" fill="#ffc629" letter-spacing="14">THE E.P.</text>
  <text x="300" y="530" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" fill="#f4f1e8" letter-spacing="10">HALF BAD · FIVE SIDES</text>
