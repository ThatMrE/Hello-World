<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-label="Silhouette of a trombone player in a porkpie hat">
  <defs>
    <pattern id="h-chk" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f4f1e8"/>
      <rect width="20" height="20" fill="#0e0e0e"/>
      <rect x="20" y="20" width="20" height="20" fill="#0e0e0e"/>
    </pattern>
    <pattern id="h-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.6" fill="#0e0e0e"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <circle cx="270" cy="270" r="215" fill="#ffc629"/>
  <path d="M270 55a215 215 0 0 1 0 430z" fill="#c8352b" opacity=".92"/>
  <rect x="55" y="470" width="430" height="52" fill="url(#h-chk)"/>
  <rect x="55" y="470" width="430" height="52" fill="none" stroke="#0e0e0e" stroke-width="6"/>
  <circle cx="270" cy="270" r="215" fill="none" stroke="#0e0e0e" stroke-width="8"/>
  <rect x="70" y="112" width="120" height="120" fill="url(#h-dots)" opacity=".55"/>

  <!-- player -->
  <g fill="#0e0e0e">
    <!-- torso -->
    <path d="M196 470c-6-92 8-152 34-176l72-4c30 26 44 88 40 180z"/>
    <!-- arms -->
    <path d="M232 316c-22 18-34 44-36 78l26 4c4-28 14-48 30-60z"/>
    <path d="M312 300c30 6 54 22 70 46l-22 18c-14-20-32-32-56-36z"/>
    <!-- neck + head -->
    <rect x="248" y="252" width="42" height="46" rx="8"/>
    <circle cx="268" cy="222" r="52"/>
    <!-- porkpie hat -->
    <rect x="216" y="150" width="104" height="46" rx="7"/>
    <ellipse cx="268" cy="196" rx="86" ry="16"/>
  </g>
  <rect x="216" y="150" width="104" height="15" rx="4" fill="#c8352b"/>
  <!-- shades -->
  <g fill="#f4f1e8">
    <rect x="228" y="212" width="34" height="17" rx="4"/>
    <rect x="272" y="212" width="34" height="17" rx="4"/>
    <rect x="262" y="217" width="10" height="5"/>
  </g>

  <!-- trombone: slide tube + bell -->
  <g stroke="#0e0e0e" stroke-width="13" fill="none" stroke-linecap="round">
    <path d="M300 246h96"/>
    <path d="M334 288h84"/>
  </g>
  <path d="M396 226l0 40 62 34V192z" fill="#0e0e0e"/>
  <path d="M404 236v20l42 24v-68z" fill="#ffc629"/>
  <rect x="330" y="240" width="16" height="54" rx="6" fill="#0e0e0e"/>
</svg>
