<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Half Bad logo">
  <defs>
    <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f4f1e8"/>
      <rect width="8" height="8" fill="#0e0e0e"/>
      <rect x="8" y="8" width="8" height="8" fill="#0e0e0e"/>
    </pattern>
    <clipPath id="roundel"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#0e0e0e"/>
  <g clip-path="url(#roundel)">
    <rect width="64" height="64" fill="url(#chk)"/>
    <rect y="24" width="64" height="16" fill="#c8352b"/>
  </g>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#0e0e0e" stroke-width="4"/>
  <!-- porkpie hat -->
  <g fill="#0e0e0e">
    <rect x="20" y="22" width="24" height="11" rx="2"/>
    <rect x="20" y="22" width="24" height="4" fill="#ffc629"/>
    <ellipse cx="32" cy="34" rx="19" ry="4.5"/>
  </g>
</svg>
