  <rect width="400" height="400" fill="#f4f1e8"/>
  <rect y="0" width="400" height="400" fill="#1e7a5e"/>

  <!-- record sleeve behind -->
  <g transform="translate(206 96)">
    <circle cx="96" cy="96" r="82" fill="#0e0e0e"/>
    <circle cx="96" cy="96" r="30" fill="#ffc629"/>
    <circle cx="96" cy="96" r="6" fill="#f4f1e8"/>
    <rect x="0" y="0" width="176" height="176" fill="#ffc629" stroke="#0e0e0e" stroke-width="6"/>
    <ellipse cx="88" cy="92" rx="46" ry="30" fill="#f4f1e8" stroke="#0e0e0e" stroke-width="5"/>
    <circle cx="88" cy="92" r="18" fill="#c8352b" stroke="#0e0e0e" stroke-width="4"/>
    <rect x="60" y="42" width="56" height="20" rx="3" fill="#0e0e0e"/>
    <ellipse cx="88" cy="63" rx="64" ry="8" fill="#0e0e0e"/>
    <rect x="0" y="146" width="176" height="30" fill="#0e0e0e"/>
  </g>

  <!-- shirt in front -->
  <use href="#tee3" fill="#f4f1e8" stroke="#0e0e0e" stroke-width="6"/>
  <rect x="130" y="196" width="72" height="72" fill="#ffc629" stroke="#0e0e0e" stroke-width="4"/>
  <ellipse cx="166" cy="232" rx="22" ry="14" fill="#f4f1e8" stroke="#0e0e0e" stroke-width="3"/>
  <circle cx="166" cy="232" r="8" fill="#c8352b"/>

  <g font-family="Haettenschweiler,'Arial Narrow Bold',Impact,sans-serif" fill="#f4f1e8">
